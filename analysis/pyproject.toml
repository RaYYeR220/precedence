[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prec-analysis"
version = "0.1.0"
description = "Analysis of the precedence measurement runs: by what rule each Solana leader ordered our probe transactions"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "jinja2>=3.1",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["prec_analysis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
