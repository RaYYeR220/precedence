[package]
name = "precedence"
edition.workspace = true
license.workspace = true
version.workspace = true
description = "Measure how Solana mainnet leaders order transactions inside their blocks"

[[bin]]
name = "precedence"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
bs58 = "0.5.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
flate2 = "1.1.10"
futures-util = "0.3.34"
hex = "0.4.3"
quinn = "0.11.12"
rand = "0.10.3"
rand_chacha = "0.10.0"
rcgen = "0.14.10"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rustls = "0.23.46"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
solana-address = "2.9.0"
solana-hash = { version = "4.7.0", features = ["serde"] }
solana-instruction = "4.0.0"
solana-keypair = "4.0.0"
solana-message = { version = "6", features = ["wincode", "serde"] }
solana-pubkey = { version = "4.4.0", features = ["serde"] }
solana-signature = "3.6.0"
solana-signer = "4.0.0"
solana-transaction = { version = "6", features = ["wincode", "serde", "verify"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
wincode = "0.6"
